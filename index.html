<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pizzeria Bella</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff8f0;--card:#fff;--tx:#2b1d16;--mu:#7a6a60;--ac:#c8372d;--bd:#ecdccf}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1512;--card:#271d18;--tx:#f6ebe3;--mu:#b5a398;--ac:#e5584d;--bd:#3b2d26}}
:root[data-theme="dark"]{--bg:#1c1512;--card:#271d18;--tx:#f6ebe3;--mu:#b5a398;--ac:#e5584d;--bd:#3b2d26}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.4}
.w{max-width:640px;margin:0 auto;padding:16px}
h1{margin:8px 0 2px;font-size:28px}
.sub{color:var(--mu);margin:0 0 16px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.item .i{flex:1}.item b{display:block}.item small{color:var(--mu)}
.p{font-weight:700;white-space:nowrap}
.q{display:flex;align-items:center;gap:8px}
button{font:inherit;cursor:pointer}
.q button{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px}
.q span{min-width:18px;text-align:center}
h2{font-size:20px;margin:24px 0 8px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
input,textarea{width:100%;font:inherit;padding:11px;margin:5px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.row{display:flex;justify-content:space-between;margin:4px 0}
.tot{font-size:18px;font-weight:700;border-top:1px solid var(--bd);padding-top:8px;margin-top:8px}
.go{width:100%;margin-top:10px;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:700;font-size:16px}
.go:disabled{opacity:.45}
.err{color:var(--ac);font-size:14px;min-height:18px;margin:4px 0 0}
</style>
</head>
<body>
<div class="w">
<h1>🍕 Pizzeria Bella</h1>
<p class="sub">Zgjidh pizzat dhe dërgoje porosinë direkt te ne.</p>
<div id="menu"></div>

<h2>Porosia jote</h2>
<div class="box">
  <div id="cart"><span class="sub">Shporta është bosh.</span></div>
  <div class="row tot"><span>Total</span><span id="total">0.00</span></div>
</div>

<h2>Të dhënat e tua</h2>
<div class="box">
  <input id="name" placeholder="Emri" autocomplete="name">
  <input id="phone" placeholder="Numri i telefonit" type="tel" autocomplete="tel">
  <input id="addr" placeholder="Adresa e dërgesës" autocomplete="street-address">
  <textarea id="note" rows="2" placeholder="Shënim (opsionale)"></textarea>
  <div class="err" id="err"></div>
  <button class="go" id="send" disabled>Dërgo porosinë në WhatsApp</button>
</div>
<p class="sub" style="font-size:13px;margin-top:12px">Porosia hapet në WhatsApp të gatshme për dërgim te pizzeria.</p>
</div>

<script>
// ===== NDRYSHO KËTU =====
const WHATSAPP = "45787810";   // numri i pizzerisë, me kodin e shtetit, pa + (p.sh. 38344123456)
const CUR = "€";                   // monedha
const MENU = [
  {id:1,n:"Margherita",d:"Salcë domate, mozzarella, borzilok",p:6},
  {id:2,n:"Pepperoni",d:"Mozzarella, pepperoni",p:8},
  {id:3,n:"Capricciosa",d:"Proshutë, kërpudha, ullinj, ar thelle",p:8.5},
  {id:4,n:"Quattro Formaggi",d:"Katër lloje djathi",p:9},
  {id:5,n:"Vegjetariane",d:"Perime të stinës, mozzarella",p:7.5},
  {id:6,n:"Coca-Cola 0.5L",d:"Pije",p:1.5}
];
// ========================
const qty = {};
const $ = id => document.getElementById(id);
const fmt = n => n.toFixed(2) + " " + CUR;

function renderMenu(){
  $("menu").innerHTML = MENU.map(m => `
    <div class="item"><div class="i"><b>${m.n}</b><small>${m.d}</small></div>
    <div class="p">${fmt(m.p)}</div>
    <div class="q"><button data-a="-" data-id="${m.id}">−</button><span id="q${m.id}">0</span><button data-a="+" data-id="${m.id}">+</button></div></div>`).join("");
}
function update(){
  let t = 0, html = "";
  MENU.forEach(m => {
    const c = qty[m.id] || 0;
    $("q"+m.id).textContent = c;
    if(c){ t += c*m.p; html += `<div class="row"><span>${c} × ${m.n}</span><span>${fmt(c*m.p)}</span></div>`; }
  });
  $("cart").innerHTML = html || '<span class="sub">Shporta është bosh.</span>';
  $("total").textContent = fmt(t);
  $("send").disabled = t === 0;
  return t;
}
$("menu").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const id = +b.dataset.id;
  qty[id] = Math.max(0, (qty[id]||0) + (b.dataset.a === "+" ? 1 : -1));
  update();
});
$("send").addEventListener("click", () => {
  const name = $("name").value.trim(), phone = $("phone").value.trim(), addr = $("addr").value.trim();
  if(!name || !phone || !addr){ $("err").textContent = "Plotëso emrin, telefonin dhe adresën."; return; }
  $("err").textContent = "";
  const t = update();
  const lines = MENU.filter(m => qty[m.id]).map(m => `• ${qty[m.id]} × ${m.n} — ${fmt(qty[m.id]*m.p)}`);
  const note = $("note").value.trim();
  const msg = `Porosi e re 🍕\n${lines.join("\n")}\nTotal: ${fmt(t)}\n\nEmri: ${name}\nTel: ${phone}\nAdresa: ${addr}` + (note ? `\nShënim: ${note}` : "");
  window.open("https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(msg), "_blank");
});
renderMenu(); update();
</script>
</body>
</html>
